name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-check:
    name: Node ${{ matrix.node-version }} / npm ${{ matrix.npm-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: 22.13.0
            npm-version: bundled
          - node-version: 24
            npm-version: latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install current npm
        if: ${{ matrix.npm-version == 'latest' }}
        run: npm install --global npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Run release gates
        run: npm run release:check
